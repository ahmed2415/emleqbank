<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMLE QBank</title>
<style>
:root{--bg:#eaf2ff;--card:#fff;--tx:#0f2342;--mut:#5b6b88;--pri:#1d6fe8;--pri2:#e3eeff;--ok:#16a34a;--okbg:#e6f7ec;--bad:#dc2626;--badbg:#fdeaea;--bd:#cfdcf3;--hd:#1d4f91;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e6edf8;--mut:#93a3bf;--pri:#4b93ff;--pri2:#1b2a47;--ok:#34d399;--okbg:#0f2a21;--bad:#f87171;--badbg:#341618;--bd:#243350;--hd:#16355f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs,16px)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:1240px;margin:0 auto;padding:14px}
h1{font-size:1.5em;margin:0}h2{font-size:1.2em;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.p:disabled{opacity:.5;cursor:not-allowed}
.mut{color:var(--mut);font-size:.9em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer}
.ch.on{background:var(--pri2);border-color:var(--pri)}
.ch span:last-child{color:var(--mut);white-space:nowrap}
input[type=number],input[type=text]{font:inherit;width:90px;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.seg label{flex:1;min-width:140px;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}
.seg label.on{background:var(--pri2);border-color:var(--pri)}
.seg input{margin-right:6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--pri)}#tm.low{color:var(--bad)}
.q{font-size:1.1em;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 14px;border-radius:10px}
.opt:hover{border-color:var(--pri)}
.opt.sel{background:var(--pri2);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;padding:6px}
.nv{position:relative;padding:3px 0;width:2.3em;font-size:.85em;text-align:center;border-radius:8px}
.nv.cur{outline:2px solid var(--pri)}.nv.ans{background:var(--pri2)}.nv.ok{background:var(--okbg);border-color:var(--ok)}.nv.bad{background:var(--badbg);border-color:var(--bad)}
.ex{white-space:pre-wrap;margin-top:10px;padding:10px 12px;border-inline-start:4px solid var(--pri);background:var(--pri2);border-radius:8px}.ex:empty{display:none}
.big{font-size:2.8em;font-weight:800;color:var(--pri);margin:0}
table{width:100%;border-collapse:collapse;font-size:.9em}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.tag{font-size:.85em;font-weight:600}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.sm{padding:4px 10px}
textarea{width:100%;font:inherit;font-size:.8em;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);word-break:break-all}
details summary{cursor:pointer}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);max-height:calc(100vh - 90px);overflow:auto;margin-bottom:0}
.nv.mk::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:#f59e0b;border:1px solid var(--card)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f59e0b}
.mkl{display:block;margin:12px 0 0;cursor:pointer}

.lay{display:grid;grid-template-columns:minmax(0,1fr) 12px var(--sw,240px);gap:0;align-items:start}
.rz{align-self:stretch;cursor:col-resize;position:relative;user-select:none}
.rz::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:3px solid var(--bd)}
.rz:hover::before{border-color:var(--pri)}
mark.hl{background:#ffe600;color:#000;border-radius:2px;cursor:pointer}
</style></head><body><main id="app"></main>
<script>
const D={"ch":["Cardiology","Chest","GIT, Liver & Infection","Hematology","Nephrology & Urology","Neurology & Psychiatry","Rheumatology","Endocrine & Others","Emergency","Orthopedics & Trauma","General Surgery","Pediatrics","Obstetrics & Gynecology","Epidemiology, Healthcare, Medico-Legal & Ethics"],"q":[[1,0,"A 60-year-old man is reviewed in the Cardiology outpatient clinic following a myocardial infarction one year previously. During his admission he was found to be hypertensive and diabetic. He complains that he has put on 5kg in weight in the past 6 months. Which of his medications may be contributing to his weight gain?",["Metforminia","Losartania","Clopidogrelia","Gliclazide","Simvastatinia"],3],[2,0,"A 64-year-old man suffers an anterior myocardial infarction. A few hours later, his pulse rate is noted to be 46/minute and his blood pressure 94/59 mm Hg. He is short of breath and has slight central chest pain. The monitor showed sinus bradycardia. What would be your choice of management?",["Insertion of temporary pacing wire","Intravenous isoprenaline","intravenous atropine","Intravenous adrenaline","Oral salbutamol"],2],[3,0,"A 68-year-old woman complains of sudden onset of severe pain in her right thigh, calf and leg of 6 hours duration. She has lost sensations from the mid-thigh distally, cannot move her foot or knee, her skin feels very cold and pale. There are no pulses felt over the femoral and popliteal arteries. She gives a history of a myocardial Infarction 6 weeks ago. What is the appropriate diagnosis?",["acute femoro-popliteal embolus","dissecting aortic aneurysm","diabetic gangrene","abdominal compartment syndrome (ACS)","popliteal artery aneurysm"],0],[4,0,"A 66-year-old woman is admitted to the hospital because of a 3-month history of shortness of breath that has progressively worsened during the past month. Initially the symptom occurred with moderate exertion; now she has shortness of breath at rest. She also has a 1-week history of swelling of her legs and feet. She has hypertension treated with 5 mg bisoprololy. Her temperature is 37 °C), pulse is 120/min, respirations are 28/min, and blood pressure is 165/95 mm Hg in both extremities. Pulse oximetry on room air shows an oxygen saturation of 92%. Physical examination shows no cyanosis. Jugular venous distention is present 4 cm above the sternal angle. Auscultation of the lungs discloses bilateral crackles in the lower and mid lung fields. Cardiac examination discloses an S3 and S4. There is bilateral pitting edema of the lower extremities to the knee. An ECG shows sinus tachycardia and bi-atrial and biventricular hypertrophy. Which of the following is the most appropriate pharmacotherapy?",["Furosemide and nitroglycerin","Nitroglycerin and Verapamil","Dopamine, furosemide","Epinephrine (adrenaline) and labetalol","Furosemide and verapamil"],3],[5,0,"A 3-month-old infant is found to have a continuous murmur all over the precordium during her routine well baby checkup. The infant is 6 kg in weight and appears well. All peripheral pulses are present and easily palpable. Oxygen saturation is 96%. What is the most likely finding on echocardiography?",["Coarctation of the aorta","Persistent ductus arteriosus","Ventricular septal defect","Dextrocardia with situs inversus","Atrial septal defect"],1],[6,0,"A 40-year-old male presents with palpitations. ECG showed atrial fibrillation. Blood pressure is 80/50, heart rate is 130, O saturation is 93%. Which is the best initial step",["Adenosine","Labetalol","Amiodarone","Defibrillation","cardioversion"],4],[7,0,"A 12-year-old girl diagnosed as rheumatic fever has a 3-week history of intermitted fevers, and malaise. Which of the following clinical findings occurs in infective endocarditis?",["Cervical nodes","Eosinophilia","Extensor surface nodules","Renal artery bruit","Janeway lesions"],4],[8,0,"A4 year old child presented with short breath and edema of both feet. Liver span was 16 cm and hepatic tenderness was noticed. Heart sounds were weak without any murmurs. X ray of the chest showed significant cardiomegaly. There was history of upper respiratory catarrh 8 weeks ago. What is the most likely diagnosis?",["Rheumatic mitral valve disease","Dilated cardiomyopathy","Fallot tetralogy","Congenital Aortic stenosis","Acute pulmonary edema"],1],[9,0,"A 61 year-old female patient is admitted with an acute abdomen for a laparotomy. Medical problems include left ventricular failure and angina treated with frusemide and diltiazem respectively. Preoperative investigations are essentially normal. Although the urea and creatinine are both raised and the ECG indicates left ventricular hypertrophy and anterior ischemia. Uncomplicated bowel resection is performed for perforation of a diverticulum with evidence of fecal peritonitis. Intraoperatively there was cardiovascular instability and an episode of supraventricular tachycardia requiring treatment. Which of the following should be offered to the patient postoperatively?",["Abdominal u/s after 24 hours.","His blood gases should be monitored hourly.","Measuring serum Na should be done every 6 hours.","Patient should be sent for the ICU for pre-existing renal and carotid vascular impairment","Triple antibiotics should be given"],3],[10,0,"A 20 -year-old basketball player collapses and dies while playing a game. Which of the following is the most likely cause?",["Coronary artery disease","Pulmonary embolism","Hypertrophic cardiomyopathy","Subarachnoid hemorrhage (SAH)","Spontaneous pneumothorax"],2],[11,0,"A 22 years old man is having inflammatory bowel disease. Which one of the following does not occur as a systemic manifestation of inflammatory bowel disease?",["Amyloidosis","Pyoderma gangrenosum","Scleritis","Cardiomyopathy","Sclerosing cholangitis"],3],[12,0,"A 60-year-old man complains of chest pain of 2 hours duration. He is diabetic. The patient is sweaty, pulse is 110 b/min and Bp is 90/60. There is bilateral basal crepitation over the back of his chest. ECG showed raised ST segment in V1 till V6. Troponin is positive. Which of the following is the most likely diagnosis?",["Stable angina","Unstable angina","Acute myocardial infarction","Acute pulmonary embolism","Acute pericarditis"],2],[13,0,"A 30 year-old woman complaining of shortness of breath and productive cough of 4 months duration. She came to the outpatient clinic because she noticed bilateral leg swelling. Physical examination revealed: pulse is 110 b/min. Bp 105/60. General examination revealed Raised JVP with bilateral pitting lower limb edema. Loud 1st heart sound with mid-diastolic murmur over her cardiac apex and ejection systolic murmur over the 2nd left intercostal space. Chest X-ray revealed cardiomegaly. What is the most likely diagnosis?",["Mitral stenosis","Mitral regurgitation","Aortic stenosis","Aortic regurgitation","Ventricular septal defect"],0],[14,0,"A patient in labor with a systolic BP of 125 mm Hg has just been given a saddle block. While lying on her back pushing on the delivery table, the level of the block stabilized at thorathic 10, fetal heart tones show a bradycardia to 105 bpm and her blood pressure drops to 90 mm Hg systolic. Which of the following is the most likely cause of these symptoms?",["Ruptured uterus","Amniotic fluid embolism","Supine hypotensive syndrome","High spinal block","Cardiac failure"],2],[15,0,"A 72-year-old man was admitted with acute pain in the right leg of several hours' duration. He gave a history of stable exertional angina and had smoked 24 cigarettes a day for many years. On direct questioning, he admitted to pain in both legs on walking for some months, which was worse on the right. On examination, the right leg was colder than the left and the foot and toes showed dusky purple discoloration with slow capillary return. The pulses in the right leg were impalpable below the femoral. Movement and sensation were normal. Which of the following is the investigation requested for this patient?",["Coronary angiography.","CT selective angiography.","Echo cardiograph","Arterial angiography to define the peripheral arterial anatomy.","Carotid duplex"],3],[16,0,"A 60-year-old banker with no past medical history presents to the emergency department 4 hours after the onset of severe substernal crushing chest pain with radiation to the left arm and neck. Electrocardiography reveals significant ST-segment elevation in leads I, L, V5, and V6. What is the most probable diagnosis in this case?",["lateral infarction","posterior infarction","inferior infarction","unstable infarction","anterior infarction"],0],[18,0,"A 16-year-old adolescent male comes to the clinic needs medical clearance to share in his high school football team. He has no complaints, and his history is unremarkable, except for a family history which includes an uncle dying suddenly while jogging at age 25. His physical examination is unremarkable except for a harsh systolic murmur loudest over his left lower sternal border. ECG shows left ventricular hypertrophy. Which of the following is the most appropriate next step in management?",["an exorcise stress test","an echocardiogram","a chest x-rays","a coronary catheterization","reassurance that he is fit to play football"],1],[19,0,"A 50-year-old hypertensive man who had a heart attack 6 months ago, presents with severe chest pain, vomiting and sweating for the last four hours. ECG shows ST elevation in leads VI – V4. Cardiac Troponin: 24 pg/mL (N. 14.5 pg/mL) & Troponin I is 12 ng/ml. (N. Below 0.04 ng/ml). What is the most appropriate line of therapy line of therapy?",["Heparin","Referred to coronary intervention","Nitrate","Aspirin and clopidogrel","Alteplase"],1],[20,0,"A 16-year-old boy accidentally presents during a school examination with a prominent left precordium and fixed splitting of the second heart sound. An ejection systolic murmur in the second left intercostal space. What is the most likely underlying structural cardiac disorder?",["ASD with pulmonary hypertension","ASD with aortic regurge","ASD with mitral regurge","Isolated ASD","ASD with aortic stenosis"],0],[21,0,"A 19-year-old woman has had increasing malaise for the past 5 months. On examination she has a systolic mummer best heard at the end of the left border of the sternum with congested jugular veins, enlarged liver and bilateral edema of both lower limbs. Laboratory investigation: Serum bilirubin: 1.0 mg/dl (N. 0.2-1.2 mg/dL) Serum albumin: 3.6 gm/dl (N. 3.5 to 5.4 g/dL) Serum creatinine is 1.5 mg/dl (N. 0.84 to 1.21). What is the most likely cause of edema in this patient?",["renal edema","cardiac edema","nutritional edema","hepatic edema","respiratory edema"],1],[22,0,"Which sign of following is most alarming for acute aortic dissection in a 51 years old male presenting with acute chest pain?",["Tachycardia","Pallor","Unequal pulse bilaterally","Pulmonary venous congestion","Hypotension"],2],[23,0,"A 35-year-old woman came to ER complaining of palpitation, cold extremities and dizziness. By examination, blood pressure was 60/40 and HR was 200 b/min. ECG showed wide QRS complex tachycardia. Which of the following is the most appropriate first approach?",["Intravenous beta-blockers","Intravenous calcium channel blockers","Termination of tachycardia by DC cardioversion","Intravenous amiodarone","Carotid sinus attack"],2],[24,0,"A 75-year-old man has beer resuscitated for more than 45 minutes following a cardiac arrest and after excluding all reversible causes. There is no sign of return of the ROSC (=Return Of Spontaneous Circulation) and a decision has been made to stop resuscitation. His relatives are waiting and are unaware of the decision. Which of the following is the most appropriate step to be taken?",["Bringing the relatives into the resuscitation room to break the news to them","Sending a junior doctor to break the news","Sending a nurse to reassure them that the team is still trying its best","Sending a senior nurse with security man to break the news in the waiting room","Meeting of the team leader with the relatives in the relative’s room to break the news"],4],[25,0,"A 25-year-old woman presents in the emergency department with acute palpitations. She is fully conscious, pulse 150 bpm, BP 125/75 mmHg, respiratory rate 20/min, oxygen saturation 99% on air, chest auscultation is clear with no evidence of cardiac failure. ECG shows narrow complex regular tachycardia. What is the most appropriate initial management step?",["DC Cardioversion","Intravenous lidocaine","Carotid sinus massage.","Intravenous adenosine","Digitalis"],2],[26,0,"A 45-year-old man presents to the emergency department complaining of the sudden onset of left substernal chest pain. He describes this as a chest pressure that rates 8 on a scale of 1 to 10. He has never had these symptoms before. He has a history of hypercholesterolemia, for which he takes a lipid lowering drug. On physical examination, he appears anxious and is diaphoretic. His blood pressure is 100/90 mmHg, and his pulse is no/min. The remainder of the physical examination is unremarkable. He undergoes an ECG, which reveals ST elevation in leads II, III, and AVF. He is diagnosed with an acute myocardial infarction. On cardiac catheterization, which of the following vessels will most likely be occluded?",["Circumflex artery","Left anterior descending artery","Left coronary artery","Posterior descending artery","Right coronary artery"],4],[27,0,"A 60-year-old woman has been diagnosed with stage 1 hypertension, with her blood pressure consistently averaging 135/85 mmHg. She does not have any other medical conditions and is generally in excellent health. Which of the following is the initial step in management of this patient?",["clonidine","diltiazem","furosemide","hydrochlorothiazide","lifestyle improvements"],4],[29,0,"A 21-year-old primigravid woman at term presents to the physician because of lightheadedness. She states that she has noticed this feeling for the past 2 days. The lightheadedness comes on only when she is lying on her back. She notices it a short time after lying down. The episode resolves completely when she sits up or stands. Which of the following is the most likely cause of this patient’s lightheadedness?",["Atrial fibrillation","Fetal movement","Inferior vena cava compression","Pulmonary embolus","Ventricular tachycardia"],2],[31,0,"Which of the following is the commonest acyanotic heart disease?",["ASD","VSD","PDA","AS","MS"],1],[32,0,"A 52-year-old woman comes to the office because of a 2-day history of pain in her right calf when walking that occurs in the evening. Twelve hours later, she had onset of rapid swelling of her right leg and she now has difficulty in walking. She says her symptoms began after she returned from a long vacation flying for 10 hours. She has a 10-year history of type 2 diabetes mellitus treated with metformin. Her temperature is 379C, pulse is 75/min, respirations are 16/ min, and blood pressure is 120/70 mm Hg. Physical examination shows edema and tenderness (pain) to palpation of the right calf. No erythema is noted. Pedal pulses are normal. Which of the following is the most likely diagnosis?",["Diabetic foot infection","Arterial embolism","Myositis","Deep venous thrombosis","Cellulitis"],3],[33,0,"The most effective method of deep venous thrombosis (DVT) prophylaxis for a fifty-year-old woman presenting for anterior resection for cancer of the colon would be",["Electrical calf stimulation","Dextran 70 infusion","Graduated compression stockings","Intermittent pneumatic leg compression","Low dose heparin (5000 units bd)"],4],[34,0,"A 65-year-old man who underwent an anterior resection for rectal cancer complains of pain in his left calf on the first postoperative day. On examination he has low-grade pyrexia (37.5°C), and the calf looks swollen with shiny skin and is tender. The patient experiences pain on dorsi flexing his foot. What is the appropriate diagnosis?",["pelvic collection","deep vein thrombosis (DVT)","superficial thrombophlebitis","Klippel-Trenaunay syndrome","iatrogenic vascular injury to iliac arteries"],1],[35,0,"A 70-year-old hypertensive man, heavy smoker with a 3-month history of backache presents with acute excruciating epigastric pain radiating to the back. O/E: blood pressure is 80/50mmHg, pulse is 130bpm (right femoral pulse is absent, while left femoral pulse is weak), marked abdominal tenderness and rigidity. What is the cause of his abdominal pain?",["Acute appendicitis","Acute pancreatitis","Ascending cholangitis","Acute MI","Ruptured abdominal aortic aneurysm"],4],[36,0,"A 75-year-old man is found by his internist to have sudden dizziness, visual disturbances, numbness in one limb side. His blood pressure is 170/100 with a carotid bruit. Which of the following is the best initial diagnostic investigation?",["Doppler ultrasonography (duplex).","Spiral CT angiography.","Arch aortogram with selective carotid artery injections.","Magnetic resonance arteriogram (MRA).","Cervical spine X ray."],0],[37,0,"All of following decrease the sensitivity and specificity of FAST exam (Focused Assessment with Sonography for Trauma) except:",["Abdominal tenderness on exam","Lumbar spine fracture","Traumatic aortic rupture","Pelvic fracture","Ecchymosis/abrasion of the anterior abdominal wall (seatbelt sign)"],2],[38,0,"A 55-year-old diabetic man C/O shortness of breath and chest pain at rest of 2 hours duration. On examination: patient is sweaty, Pulse 100 b/min. regular of low volume, B.P 140/90. Respiratory rate is 16 breath/min. Cardiac and chest examinations are unremarkable. Investigations: Troponin is elevated. Which one of the following is the gold standard investigation to diagnose this patient?",["Resting ECG","Stress ECG","Ventilation-perfusion (VQ) scan","Cardiac catheter","D-Dimer"],3],[39,0,"A 65-year-old woman presents to the clinic complaining of progressive shortness of breath on exertion. She reports no chest pain, cough, or wheeze, and otherwise feels well. There is no history of overt blood loss, change in bowel habits, or weight loss. Her past medical history is significant only for cholecystitis, and a remote wrist fracture after a fall. On examination, blood pressure of 120/50 mmHg, a soft S2, and a diastolic and systolic murmur heard best at the left sternal border. There is also a rapidly rising, forceful carotid pulse that collapses quickly. Which of the following is the most likely diagnosis?",["mural stenosis","mitral regurgitation","aortic stenosis","aortic regurgitation","coarctation of the aorta"],3],[40,0,"Which one of the following clinical features is least consistent with a type B aortic dissection?",["Severe tearing chest pain","Elevated blood pressure","Asymmetry of femoral pulses","New early diastolic murmur","Acute renal failure"],3],[41,0,"A Man aged 62 had developed pain in his right foot at rest and particularly at night. This had persisted for 2 weeks and was resulting in considerable loss of sleep. There was a history of pain in the left calf on walking for about 100 m during the previous 6 months. Examination revealed that pulses were absent in both feet and the right foot was cold and pale compared with the left. There was a right carotid bruit. Which of the following is the most likely diagnosis?",["Dissecting Aortic an every time.","Arterial embolization.","Spinal canal stenosis.","Vascular rest pain due to vascular occlusive disease.","Burgur disease."],3],[43,0,"A 37-year-old woman with right lower extremity edema is evaluated because of the sudden onset of Shortness of breath and pleuritic chest pain. A diagnosis of pulmonary embolism is made. Which of The following signs, if present on physical examination, would be the most specific indicator of Pulmonary arterial hypertension in this patient",["Increased jugular venous pressure","P2 louder than A2","Peripheral edema","Presence of an S3","Pulmonary crackles"],1],[44,0,"A 40 year old man, 18 hours after a gastrectomy, suddenly becomes hypotensive with a blood pressure of 80/60, tachycardia of 110/min, CVP +2 cm, H O and a temperature of 39C. The likely diagnosis is:",["Ruptured anastomosis","Hemorrhage","Acute gastric dilatation","Pulmonary embolism","Septicemia"],0],[45,0,"A 56-year-old woman came to the clinic because of chest pain (usually worse with breathing) anxiety, palpitations (heart racing) and coughing up blood. She was diagnosed as acute pulmonary embolism. Which of the following is the most frequent ECG finding in this case?",["Q wave","P. pulmonale","Sinus tachycardia","Sinus bradycardia","Left axis deviation"],2],[46,0,"A 48-year-old man is admitted to the coronary care unit with an acute inferior myocardial infarction. Two hours after admission, his blood pressure is 86/52 mmhg, his heart rate is 40 beats per minute with sinus rhythm. He gives a history of recurrent attacks of chest pain in the left side of the chest over the last 2 years that always comes after severe effort. The pain is relieved by rest or some sublingual drugs prescribed by his doctor. Which of the following would be the most appropriate initial therapy?",["Immediate insertion of a temporary transvenous pacemaker","Administration of normal saline, 300 ml over 15 min","Intravenous administration of atropine sulfate, 0.6 mg","Intravenous administration of dobutamine, 0.35 mg/min","Intravenous administration of isoproterenol, 5.0 g/min"],0],[47,0,"A 45-year-old man comes to the clinic with sudden onset of dyspnea, pleuritic chest pain, and tachycardia. Which of the following diagnostic tests is the most appropriate initial step in the evaluation of suspected pulmonary embolism?",["Chest X-ray","Electrocardiogram","D-dimer assay","Ventilation-perfusion scan","CT pulmonary angiography"],4],[48,0,"A 65-year-old patient with dilated cardiomyopathy is wakened up two hours after sleep on dyspnea, wheezes and coughing pink frothy sputum, which of the following is the most likely cause?",["Cardiac asthma","Acute lung collapse.","Pneumothorax.","Bronchial asthma","Pulmonary embolism"],0],[49,0,"A 45-year-old woman came to the clinic complaining of progressively worsening symptoms, including fatigue, weight gain, and depression. She has a history of untreated hypothyroidism. On examination, a significant swelling of the face, hands, and feet, along with coarse, dry skin were noticed. Laboratory tests confirm hypothyroidism with elevated TSH levels and low free T4. If left untreated, which of the following is the most likely complication?",["Osteoporosis","Hypertension","Type 1 diabetes mellitus","Glaucoma","Pancreatitis"],1],[50,0,"A 54-year-old man presents with orthopnea, paroxysmal nocturnal dyspnea, and bilateral lower extremity edema. On physical examination, crackles are heard bilaterally in the lung bases. Which of the following is the most likely type of heart failure?",["Right-sided heart failure","Systolic heart failure","Diastolic heart failure","Biventricular heart failure","High-output heart failure"],3],[51,0,"A 78-year-old man with a history of heart failure lives with his daughter. He recently started taking a new medication for high blood pressure. Over the past week, he has become increasingly withdrawn and stems to be forgetting things more often than usual. He has also had a few falls recently. Which of the following is the most likely explanation for the patient’s recent decline?",["Vitamin deficiency","Side effect of new medication","Early signs of dementia","Depression","Increased social isolation"],1],[52,0,"A 55-year-old male smoker with diabetes and hypertension presents with complains of chest pain on exertion. Exercise stress testing shows reversible ischemia in the anteroseptal portion of the heart after exercising 4 minutes. Cardiac catheterization reveals on 80% stenosis of the left main coronary artery. Which of the following is the most appropriate intervention?",["Re-examination in 6 months or sooner if symptoms worsen","Beta blocker","Sublingual nitroglycerin as needed","Percutaneous balloon angioplasty","Coronary artery bypass grafting"],4],[54,0,"A 75-year-old man with a history of heart failure presents with worsening shortness of breath and swollen ankles. He is taking diuretics, but reports do not restrict his fluid intake. Which of the following is the most appropriate next step in managing his heart failure?",["Change the diuretic drug","Prescribe him a beta-blocker medication","Stress on fluid restriction and dietary sodium modification","Schedule him for an echocardiogram","Admit to the hospital for intravenous diuretics"],2],[55,0,"On the second postoperative day after an abdominoperineal resection for cancer of the rectum a 72-year-old man complains of severe retrosternal pain. The pain is crushing in nature and radiates to the left arm. He also becomes short of breath and tachycardia. Except for his fresh surgical wounds and postoperative discomfort, physical examination is unremarkable. He does not have distended neck veins. Which of the following is the most appropriate next step in diagnosis?",["Blood gases","Chest x-ray film","Pulmonary angiogram","Transaminase levels (ALT, AST)","Troponins"],4],[56,0,"A 40-year-old retired professional football player complains of sudden onset of palpitations and shortness of breath 5 days after having knee replacement surgery. His pulse is 100 beats/minute and regular. Oxygen saturation is 90% at room air. An ECG reveals sinus tachycardia. A chest X- ray film is unremarkable. Which of the following is the most appropriate next step in management?",["Order an arterial blood gas","Schedule a duplex Doppler examination of the lower extremities","Schedule a ventilation perfusion scan","Administering supplemental oxygen","Administering IV heparin"],4],[57,0,"A 62-year-old, right-handed man has transient episodes of paralysis of the right arm and inability to express himself. There is no associ ened her bowels in 4 days, and has not passed flatus for 2 days. She denies vomiting. On examination the abdomen is soft and non-tender but, grossly distended, with a tympanic percussion note. An abdominal X-ray shows a dilated gas filled large bowel with a coffee bean appearance. What is the most likely diagnosis?",["Constipation","Femoral hernia","Sigmoid Volvulus","Rectal Cancer","Pseudo obstruction"],2],[685,10,"A 68-year-old woman with chronic constipation is brought with a history of rapid distention of the abdomen and constipation. She has had previous similar episodes which have been treated conservatively. Abdominal X-ray reveals 'coffee bean' sign. Which of the following is the most likely diagnosis?",["Adhesions","Recurrence of malignancy","Strangulated external hernia","Primary colonic tumor","Sigmoid volvulus"],4],[686,10,"A previously healthy 15-year-old boy is brought to the emergency room complaining of progressive anorexia, nausea, and pain in the right lower quadrant of the abdomen for about 12 hours. On physical examination, he is found to have a rectal temperature of 38.2°C and direct and rebound abdominal tenderness localizing to McBurney’s point as well as involuntary guarding in the right lower quadrant. At operation through a McBurney- type incision, the appendix and cecum are found to be normal, but the surgeon is impressed by the marked edema of the terminal ileum, which also has an overlying fibrinopurulent exudate. Which of the following is the most appropriate next step in management?",["Close the abdomen after culturing the exudate.","Perform a standard appendectomy.","Resect the involved terminal ileum.","Perform an ileocolic resection.","Perform an ileocolostomy to bypass the involved terminal ileum"],1],[687,10,"A 50-year-old man comes to the Emergency Room (ER) with a history of vomiting of 3 days duration. His past history reveals that for approximately 20 years, he has been experiencing epigastric pain that lasts for 2–3 weeks during spring and autumn. He remembers getting relief from pain by taking milk and antacids. Physical examination showed a fullness in the epigastric area with visible peristalsis, absence of tenderness, and normal active bowel sounds. Which of the following is the most likely diagnosis?",["gastric outlet obstruction","small bowel obstruction","volvulus of the colon","incarcerated umbilical hernia","cholecystitis"],0],[689,10,"A 35-year-old man complains of right hypochondrial pain, fever, jaundice, and shaking chills. Ultrasound of the abdomen demonstrates gallstones, normal gallbladder wall thickness, and common bile duct of 1.0 cm. The patient is admitted to the hospital and is given IV fluids and antibiotics. He continues to be febrile with increasing WBCs. Which of the following is the most appropriate next step in this patient’s management?",["Endoscopic retrograde cholangiopancreatography (ERCP)","Placement of a cholecystostomy tube","Laparoscopic cholecystectomy","Open cholecystectomy","Emergent operation and decompression of the common bile duct with a T tube"],0],[691,10,"An 82-year-old man complains of severe abdominal distention, nausea, vomiting, and colicky abdominal pain. He has not passed any gas or stools for the past 12 hours. His vital signs are normal, and his pulse is regular, Abdominal X-ray films show distended loops of snail and large bowel, as well as a very large round gas shadow that is located in the right upper quadrant and tapers toward the left lower quadrant in the shape of a parrot’s beak The patient has never had any abdominal surgery, and he does not have any palpable hernias. Which of the following is the most appropriate next step in management?",["Nasogastric suction, IV fluids, and observation","Repeated enemas and laxatives","Emergency celiac and mesenteric arteriogram","Proctosigmoidoscopy","Emergency exploratory laparotomy"],3],[692,10,"A 53-year-old man presents to the emergency room with loft lower quadrant pain, fever, and vomiting. CT scan of the abdomen and pelvis reveals a thickened sigmoid colon with inflamed diverticula and a 7-cm by 8-cm rim-enhancing fluid collection in the pelvis. After percutaneous drainage and treatment with antibiotics, the pain and fluid collection resolve. He returns os on outpatient to clinic 1 month later. He undergoes a colonoscopy, which demonstrates only diverticula in the sigmoid colon. Which of the following is the most appropriate next step in this patient’s management?",["Expectant management with sigmoid resection if symptoms recur","Cystoscopy to evaluate for a fistula","Sigmoid resection with end colostomy and rectal pouch (Hartmann procedure)","Sigmoid resection with primary anastomosis","Long-term suppressive antibiotic therapy"],0],[693,10,"A 70-year-old woman has nausea, vomiting, abdominal distention, and episodic crampy midabdominal pain. She has no history of previous surgery but has a long history of cholelithiasis for which she has refused surgery. Her abdominal radiograph reveals a spherical density in the right lower quadrant. Which of the following is the definitive treatment for this patient’s bowel obstruction?",["Ileocolectomy","Cholecystectomy","Beotomy and extraction","Nasogastric (NG) tube decompression","Intravenous antibiotics"],2],[694,10,"A 22-year-old man is involved in a knife fight after a soccer game. He is brought to the emergency department. An 8-cm laceration that involves the right cheek, from his right ear to near the corner of his mouth, is noted. Which of the following structures is the most likely injured?",["Parotid duct","Submandibular duct","Superficial temporal artery","Lingual artery","Mandibular branch of the facial nerve"],0],[695,10,"A 45-year-old woman comes to the emergency department because of the sudden onset of abdominal pain that radiates from the right hypochondrium to the shoulder. The pain is steady, with periodic exacerbations. The patient is afebrile. Ultrasound examination reveals a stone in the cystic duct. Which of the following is the most appropriate next step in management?",["Ursodeoxycholic acid treatment","Lithotripsy with bile salt treatment","Endoscopic sphincterotomy with stone extraction","Laparoscopic cholecystectomy","Non-steroidal antiinflammatory"],3],[696,10,"A 60-year-old alcoholic man is admitted to the emergency department with hematemesis. His pulse is 110/min, blood pressure os 100/60mmHg, and respirations are 19/min. He has multiple spider angiomata on his back and chest, with bilateral gynecomastia. Abdominal examination is significant for hepatosplenomegaly, and his abdomen is distended with ascites on percussion. His hematocrit is 23%. After placement of a nasogastric tube, 400 ml of bright red blood is evacuated. After initial fluid resuscitation, which of the following to the most appropriate next step in management?",["Barium swallow","Esophageal balloon tamponade","Esophagogastroscopy","Exploratory celiotomy","Selective angiography"],2],[697,10,"A 2-year-old boy is brought in with a right groin lump. This proves reducible with sedation, analgesia and cold packs. It is planned for him to return for day-case surgery in 48 h. What is appropriate management option?",["Bassini repair","Herniotomy","High crural (Lothiessan) approach","Shouldice procedure","Truss"],1],[698,10,"A 39-years-old man presented by a swelling in the right groin. On examination, the swelling is reducible at lying flat and descend to the bottom of the scrotum in erect position. Indirect ring test is positive, which of the following is your diagnosis?",["Direct inguinal hernia","femoral hernia","hydrocele","Incisional hernia","Indirect inguinal hernia"],4],[699,10,"A 43-year-old woman came to the General Surgical Outpatient clinic complaining of a lump in her right groin which has been present for 1 year. She has a past medical history of asthma and is a heavy smoker. On physical examination, a 3*4 cm blue non-tender, non-expansile mass is palpable medial to the femoral pulse. It disappears on lying flat and there is an associated weak cough impulse when the patient is standing. The presence of dilated tortuous veins in the long saphenous vein distribution is also noted. Which of the following is the most likely diagnosis of this swelling?",["Femoral aneurysm","Saphenovarix","Lipoma","Femoral hernia","Inguinal lymph node"],1],[700,10,"A male patient 61-year-old complained of progressive yellowish discoloration of the sclera & itching with vague abdominal pain. Carcinoembryonic antigen (CEA) was 523 ng/mL (0-2.4 ng/mL), CA 19-9 was 450 Unit/mL (0-37 unit/mL), ultrasound study was unremarkable, serum bilirubin was 12 mg/dl (0.3-1.2 mg/dl) and CT scan of the abdomen revealed bulky pancreas and multiple scattered hepatic metastatic nodules. What is the management for this patient?",["Pancreaticoduodenectomy + hepatic resection","ERCP stenting","total pancreatectomy","radiotherapy only","pancreaticoduodenectomy"],1],[701,10,"A 50 year-old female, had been on diet recently with a weight loss of 20 lb, presents with a small bowel obstruction and pain, which radiates down the inside of her thigh to the knee. She has no past history of abdominal surgery. Which of the following is the likely diagnosis?",["Strangulated obturator hernia","Obstructing neoplasm of the ileum","Gallstone ileus","Strangulated femoral hernia","Fracture of the pubic bone"],0],[702,10,"You are assisting with a primary open right inguinal hernia repair in a 27- year-old male. During the operation, the lead surgeon asks you to define the boundaries of the inguinal canal. Which of the following does not form port of the boundaries of the inguinal canal?",["Transversalis fascia and the conjoint tendon","Inguinal ligament","Pectineal ligament","Aponeuroses of the external and internal oblique fibers","Arching fibers of the internal oblique and transversus abdominis Muscles"],2],[703,10,"You are teaching a junior doctor about the management of Bartholin abscess. Which one of the following procedures should not be done?",["Incision and drainage.","Saucerization operation.","Marsupialization.","Wood catheter","Excision of chronic abscess"],1],[705,10,"A 30-year-old woman presents with multiple bilateral breast swellings which cause her discomfort, particularly just before her periods. They have been present for several years but appear to be getting worse, which of the following is the most likely diagnosis?",["Duct ectasia","Fat necrosis","Fibroadenoma","Fibrocystic disease","Peau d’orange"],3],[706,10,"A 74-year-old woman with a BMI of 36 presents with a painful lump around her umbilicus. She has had it for several years and it has increased in size recently. Examination reveals a large, tender, hard, lump over the umbilicus with bluish discoloration and no cough impulse. Her laboratory findings showed White blood cells 16x103/cc (5-1x103/cc). Hb. 9.8 mg/dL (1-13 mg/dL) and ALT 100 IU/L (12-40 IU/L. What is the appropriate diagnosis?",["Strangulated umbilical hernia","Umbilical granuloma","Strangulated femoral hernia.","Sigmoid volvulus.","Paralytic ileus."],0],[707,10,"Which of the following is a content of the spermatic cord?",["Ilioinguinal nerve","Genital branch of genitofemoral nerve","Femoral branch of genitofemoral nerve","Pudendal nerve","obturator nerve"],1],[708,10,"During a repair of a primary inguinal hernia, you are asked to name the nerve that is located within the spermatic cord. Which of the following is the nerve that is found within the spermatic cord?",["llioinguinal nerve","Genitofemoral nerve","Genital branch of the genitofemoral nerve","lliohypogastric nerve","Lateral femoral cutaneous nerve"],2],[709,10,"An 82-year-old woman presents with a 24-hour history of a painful swelling in her left groin. The patient is unwell and dehydrated with a tachycardia of 110 beats/min. On examination, the swelling is 3 x 3cm in size, firm and tender. It is not reducible. What is the most likely diagnosis?",["Femoral artery aneurysm","Inguinal hernia","Femoral hernia","Inguinal lymphadenopathy","Saphena varix"],2],[710,10,"A 70-year-old cigarette smoker presents with a right inguinal mass that has enlarged and has caused discomfort in recent months. He complains of recent difficulty with micturition and nocturia. The swelling, which does not extend to the scrotum, reduces when resting. What is the likely diagnosis?",["Direct inguinal hernia","Hydrocele","Aneurysm of the femoral artery","Cyst of the cord","Strangulated indirect inguinal hernia"],0],[711,10,"A 20-year-old man presents to his GP with a testicular swelling. His serum lactate dehydrogenase (LDH) is raised with a mildly raised human chorionic gonadotrophin (HCG) and a normal alpha fetoprotein. Which of the following is the most likely diagnosis?",["Teratoma","Adenocarcinoma","Squamous cancer","Anaplastic cancer","Seminoma"],4],[712,10,"A 30-year-old man presents with a left-sided dragging pain and swelling in the left hemi-scrotum. On examination, he has a left-sided swelling that is palpated separately from the testes and feels 'like a bag of worms'. The swelling disappears on lying supine. Which of the following is the most likely diagnosis?",["Hydrocele","Indirect inguinal hernia","Testicular tumor","Epididymal cyst","varicocele"],4],[713,10,"A 27-year-old man presents with pain in his left testis that has been present for the past 2 days. The pain has been getting gradually worse and there is now also noticeable swelling of the testis. On examination he is febrile with a temperature of 38.3°C and the scrotum appears red and edematous on the affected side. The testis is tender on palpation. Which one of the following is the most likely diagnosis?",["Scrotal hematoma","Testicular torsion","epididymo-orchitis","torsion of hydatid of Morgagni","irreducible inguinoscrotal hernia"],2],[714,10,"A 27-year-old man reports experiencing pain in his left testis over the last 48 hours. The pain has been progressively worsening, accompanied by observable swelling in the testis. During examination, he presents a fever, registering a temperature of 38.3°C, and the affected side of the scrotum appears red and swollen. Palpation reveals tenderness in the testis, which one of the following is the most likely diagnosis?",["Scrotal hematoma","Testicular torsion","epididymo-orchitis","torsion of hydatid of Morgagni","irreducible inguinoscrotal hernia"],2],[715,10,"You are called to see a 56-year-old man who is one day post appendicectomy because he became acutely short of breath. He has just been given his first dose of cyclizine to relieve nausea. On arrival, the patient is breathless with the following observations: heart rate 122/min, blood pressure 86/48mmHg and saturations 85% in air. Which of the following would you administer first?",["Adrenaline","Chlorphenamine","Fluids","Hydrocortisone","Salbutamol"],0],[716,10,"A 24-year-old female undergoes a colonoscopy and is found to have multiple adenomatous polyps in the colon and rectum. Which is the single most likely genetic disorder to explain these findings?",["Gardner’s syndrome","Hereditary juvenile polyposis","Lynch syndrome","Peutz–Jeghers syndrome","Sipple’s syndrome"],0],[717,10,"A 62-year-old man presents to the GP with a lump in the left groin which has been present for over 2 months. On examination, the lump is above the inguinal ligament. It is reducible and has a cough impulse, but does not extend into the scrotum. Which of the following is the most likely diagnosis?",["Direct inguinal hernia","Femoral hernia","Gluteal hernia","Indirect inguinal hernia","Obturator hernia"],0],[718,10,"A 56 year male had a left hypochondrial pain and tenderness. Abdominal ultrasound revealed a splenic abscess. What is the treatment of choice?",["Antibiotics alone.","Percutaneous drainage.","Partial splenectomy.","Total splenectomy.","None of the above"],3],[719,10,"A 44-year-old man presents to the GP having noticed a painless swelling in the right side of the scrotum. On examination, the scrotum is swollen and non-tender. The swelling transilluminates and the testis itself is not palpable. What is the most likely diagnosis?",["Epididymo-orchitis","Hydrocele","Inguinal hernia","Testicular torsion","Varicocele"],1],[720,10,"A 67-year-old woman presents with a 2×2 cm swelling in the left groin crease. The swelling is non-tender and irreducible. On examination the swelling is not mobile, and not tethered to the underlying tissue, there is a smaller 1×1 cm swelling on the contralateral side, and several similar 1×1 cm swellings in the axilla. What is the most appropriate diagnosis?",["Saphena varix","Abscess","Femoral hernia","Femoral artery pseudoaneurysm","Lymphadenopathy"],4],[721,10,"A 69-year-old male, a heavy smoker with a history of insulin-controlled diabetes mellitus, reports experiencing pain and numbness in his right lower limb that began 4 hours ago. For the past two years, he has had pain in his right leg after walking for 5 minutes, which forces him to rest before he can continue walking after 3 minutes. Upon examination, his right lower limb shows pale bluish discoloration of the skin and calf muscle wasting, and the femoral pulse is not palpable. Based on these findings, what is the most likely provisional diagnosis?",["DVT","Chronic lower limb ischemia","Acute lower limb ischemia","Severe diabetic neuropathy","Buerger’s disease."],2],[722,10,"A77-year-old man came to the clinic complaining of blood in stool. Rectal examination revealed a mobile mass. On workup, he was found to have a stage I (Dukes A) well-differentiated adenocarcinoma. Which of the following is the most appropriate intervention?",["Transanal excision","Abdominal perineal resection","Low anterior resection","Placement of endorectal walistent","Neoadjuvant chemotherapy followed by Transonal resection"],0],[723,10,"A 62-year-old woman has an eczematoid lesion in the areola of her right breast that has been present for 3 months. She has self-medicated with skin lotions and over-the counter steroid ointments, but the area has not improved. On physical examination, the nipple is inverted, the skin of the areola is reddish and desquamated, and the entire area feels firm, with no discrete mass demarcated from the rest of the breast. Which of the following is the most appropriate next step in management?",["Estrogen cream and systemic estrogen replacement","Mammogram and galactogram","Mammogram and punch biopsies","Serum levels of glucagon and CT of the pancreas","Skin scrapings, culture and appropriate topical antibiotic"],2],[724,10,"Six hours after undergoing laparoscopic bilateral inguinal hernia repairs, a 62-year-old man complains of suprapubic discomfort and fullness. He feels the need to void but has not been able to do so since the operation. There is a palpable suprapubic mass that is dull to percussion Palpation of that mass exacerbates the symptoms. Which of the following is the most appropriate next step in management?",["Abdominal X-ray films to ascertain the nature of the mass","Increased rote of IV fluid administration","Loop diuretics","in and out blood catheterization","Placement of suprapubic catheter"],3],[725,10,"An 18-year-old man is admitted to the ED shortly after being involved in an automobile accident. He is in a coma (GCS = 7). His pulse is barely palpable at a rate 140 beats per minute, and BP is 60/0. Breathing is rapid and shallow, aerating both lung fields. His abdomen is moderately distended with no audible peristalsis. There are closed fractures of the right forearm and the left lower leg. After rapid IV administration of 2 L of lactated Ringer solution in the upper extremities, his pulse is 130 beats/minute and BP 70/30 mmHg. Which of the following is the proper next step?",["Obtaining cross-table lateral X-rays of the cervical spine","Obtaining head and abdominal CT scans","Obtaining supine and lateral decubitus X-rays of the abdomen","Obtaining on arch aortogram","Exploring the abdomen."],4],[726,10,"A 42-year-old woman came to the Out Patient Department (OPD) complaining of intermittent painless swelling in her right groin since 2 years with no other symptoms. Examination showed soft mass in the upper medial aspect of the thigh that disappears on compression. Which of the following is the most likely diagnosis?",["Direct inguinal hernia.","Saphena varix","Inguinal lymphadenopathy.","Indirect inguinal hernia","Femoral hernia"],1],[727,10,"A 64-year-old man presents with a 2-day history of abdominal pain which he describes as constant, dull and around his umbilicus and occasionally migrating to his groin. He has a body mass index (BMI) of 27 and a past medical history of poorly controlled hypertension. Abdominal examination reveals a pulsatile and expansile mass just below the umbilicus. What is the most appropriate screening investigation?",["Abdominal ultrasound","Abdominal x-ray","Computed tomography (CT) scan of the abdomen","Abdominal magnetic resonance imaging (MRI) scan","Angiography"],0],[728,10,"Abdominal ultrasonography of 23 years old, male patient with abdominal enlargement revealed moderate ascites with adhesions. Serum-ascites albumin gradient (SAAG) was <1.1 g/dL. Which one of the following is the best diagnostic tool?",["Complete blood count","Laparoscopy","Abdominal radiography","Ascitic fluid cytology","Karyotyping"],1],[729,10,"A 40 year-old male with a surgical history of appendectomy presents with abdominal pain and vomiting. You strongly suspect small bowel obstruction. Which of the following abdominal examination findings is most likely to be present?",["Distention","Focal tenderness","High-pitched bowel sounds","Rebound tenderness","Percussion tenderness"],0],[730,10,"The most definitive method available to accurately diagnose the presence of necrotizing soft-tissue infection (NSTI) is?",["Erythema and pain","Magnetic resonance imaging","The presence of an elevated white blood cell count and hyponatremia","Surgical exploration","Hyponatremia in the setting of fever and an elevated white blood cell count"],3],[731,10,"A 22-year-old man presented to you complaining of abdominal pain. On clinical examination: A left upper quadrant mass of his abdomen is felt. Which of the following features diagnose clinically a kidney rather than a spleen?",["Cannot palpate above it","Presence of a notch","Dullness to percussion","Extends towards the right lower quadrant","Ballotable"],4],[732,10,"A 35-year-old woman noticed a painful left breast mass when carrying her only daughter to school. That evening, whilst undressing, she found a creamy-colored discharge from the nipple on her underwear. She received course of amoxicillin 500 mg td’s. Three days later, she discovered a lump under her nipple and attended the casualty department requesting a surgical opinion. On examination she had an axillary temperature of 37.5°C, there was marked periareolar inflammation of the left breast and a very tender 4cm diameter spherical mass underlying the medial aspect of the areolar with thinned overlying skin. Which of the following is the management option for this condition?",["Mammography","Breast sonography.","Surgical drainage.","Repeated needle aspiration","Major duet excision."],2],[733,10,"During initial exploration in a patient scheduled to undergo a right hemicolectomy for colon cancer, a deep 4-cm liver mass is seen in the right lobe of the liver. The left lobe appears to be normal. Intraoperative biopsy of the lesion is positive for metastatic colon cancer. Which of the following is the best management of this patient?",["Immediate closing of the patient and referring for chemotherapy only","Performing right hemicolectomy only.","Performing right hemicolectomy and right hepatic lobectomy.","Performing right hemicolectomy and wide excision of the liver lesion.","Performing liver resection only"],1],[734,10,"A 25-year-old male was kicked in his abdomen accidentally while playing football. He got up and continued to play for another few minutes, but then he felt dizzy with intense pain in his left upper abdomen. In the hospital he complained of pain in his left shoulder tip and had rigidity and rebound tenderness in his left hypochondrium. His pulse was 120 while his blood pressure was 100/70. He gave history of living in tropical country till the age of 18 where he had suffered from malaria. What is the appropriate diagnosis?",["Splenic infarction.","Splenic rupture","Ruptured diaphragm.","Splenic artery aneurysm.","Hereditary spherocytosis"],1],[735,10,"A 24-year-old man is evaluated for a suspicious looking mole. He had undergone a punch biopsy, which demonstrated a melanoma. He has no prior history of skin cancer, no family history of skin cancer, nor any history of blistering sunburns. Which of the following results in the pathology report are most predictive of the outcome?",["Size of the melanoma","Color of the melanoma","Depth of the melanoma","Presence of ulceration","Site of the melanoma"],2],[736,10,"What is the best management of a newly agitated patient in the ward?",["Give him midazolam","Give him carbamazepine","Give him ketamine","Give him lamotrigine","Give him haloperidol"],4],[737,10,"Which of the following is the \"time out\" in surgery?",["The purpose is to check for any abnormality in the patient’s preoperative investigations","includes shaving of the surgical area the evening before the operation","It is done inside the operating room for ensuring patient identity, type and side of the operation","It is the time where the surgical site marking is done","It is the recording of the time from the start of the operation till its end"],2],[738,10,"Female patient 75-year-old presented with right iliac fossa mass and gave history of recurrent attacks of bleeding per rectum. Colonoscopy was done which revealed a mass in the caecum. Biopsy revealed adenocarcinoma grade II. Which of the following should the surgical treatment ome bright red blood on the toilet paper when he wipes. There is increasing constipation. No weight loss. On examination, anus and rectum are externally normal. However, digital examination could not be performed because of severe discomfort and sphincter spasm. Which of the following is the most likely diagnosis?",["Anal squamous cell carcinoma","Acute anal fissure","Grade IV hemorrhoids","Diverticular disease","Anal fistula"],1],[744,10,"An otherwise healthy 28-year-old man comes to his physician because of painless enlargement of the right testis. He began to feel a sensational heaviness in the right hemiscrotum approximately 6 months ago. Physical examination reveals diffuse enlargement of the right testis, but it is difficult to determine whether this is due to an intratesticular or extratesticutar lesion. Which of the following is the most appropriate next step in diagnosis?",["CT scanning","Serum levels of hCG, alpha-fetoprotein, and LDH","Scrotal ultrasonography","Needle biopsy","inguinal orchiectomy"],2],[745,10,"A 64-year-old woman complains of right calf pain and swelling. She recently underwent an uncomplicated left hemicolectomy for diverticular disease. A duplex ultrasound confirms the presence of deep vein thrombosis (DVT) of the calf. Which of the following is the most appropriate initial management of this patient?",["Pneumatic compression stockings","Warfarin","Heparin","Thrombolysis","Inferior vena cava filter"],2],[746,10,"A 12-year-old female is brought in by EMS after a gunshot wound. The patient was injured incidentally when her older brother was \"showing off\" his gun to his friends. She presents with two soft-tissue wounds to her right leg, with significant swelling about the right knee. An x-ray demonstrates a small amount of shrapnel, and a small fracture to the distal cortex of her femur. Clinically, there is expanding, non-pulsatile, swelling in the area of the knee. Which of the following is the next best step?",["Take her to the opera t line of management is:",["Wait and watch","Induction of labor","Blood transfusion","Cesarean section","none of the above"],0],[975,12,"A 22-year-old gravida 3 Para 0+2, sure of her dates, came at 9 weeks gestation with vaginal spotting. An ultrasound scan has been performed on weekly basis since the diagnosis of her pregnancy. They all failed to detect a fetal pole in spite of a gestational sac diameter matching her dates. What is the appropriate management?",["Repeat ultrasound after one week","Parenteral progesterone.","Folic acid.","Cervical cerclage.","Termination of pregnancy"],4],[976,12,"A 33-year-old gravida 2 Para 1 (stillborn infant). She had a screening test for diabetes mellitus at 10 weeks’ pregnancy. One-hour post-prandial glucose test is 145 mg/dl. What should be included in the follow-up of this patient?",["Serial follow up with domiciliary glucose urine testing.","Serial 3D ultrasound.","Serial follow up with domiciliary blood sugar testing.","No further testing and no need for treatment.","Standard glucose tolerance test."],2],[977,12,"A 26-year-old Para 1+2 came to the emergency department 3 weeks after an abortion, with severe vaginal bleeding. She reported undergoing surgical evacuation 3 weeks earlier, but did not return to receive the pathology report of the specimen. Her beta- subunit titer was above 100,000 milli- international units/milliliter, her ultrasound showed an intra-uterine mass 4x4 centimeters. What is the most appropriate management?",["Start chemotherapy","Hysterectomy","Resuscitation and uterotonics","Resuscitation and re-evacuation","Resuscitation followed by conservative management"],3],[978,12,"Three days after undergoing uncomplicated caesarean delivery of a boy with weight 4 Kg at term, a 36- year-old, gravida 3, para 3 woman has sudden onset of right-sided chest pain and cough productive of bloody sputum. Pregnancy was complicated by gestational diabetes. She smoked one pack of cigarettes daily for 10 years but quit when she became pregnant. Her temperature is 37.1°C (98.8°F), pulse is 108/min and regular, respiratory rate is 28/min, and blood pressure is l16/70 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 92%. Physical examination shows mild pallor of the skin and conjunctivae. Auscultation of the lungs discloses decreased air entry over the right lung base; a pleural rub is heard. There is no calf pain or edema of the lower extremities. ECG shows no abnormalities. X-ray of the chest shows a wedge shaped opacity over the right lower lung zone with obliterated the costophrenic angle. Which of the following is the most likely diagnosis?",["Pulmonary embolism","Chronic obstructive pulmonary disease","Acute bronchitis","Pleural effusion","Post-operative pneumonia"],4],[979,12,"During the induction of labor with misoprostol for a 41.5-week multigravida woman, she begins to feel increasing pelvic pressure and low back pain. Fetal heart tracing is reassuring, and maternal vital signs are Pulse 92, BP 110/68, R rate 18; Temp 37. The contractions are every 2 to 3 minutes and moderate. Her cervix is 2 cm and 50% effaced. The head is at 0 station. There is external blood-tinged mucus. What does this situation represent?",["primary arrest of labor","early active phase labor","impending rupture of the uterus","prolonged latent phase labor","tachysystole"],3],[980,12,"A 21 year-old G1 at 9 weeks gestation with proven intrauterine pregnancy presents to the ED with severe nausea and vomiting for 4 days. She has been unable to eat and can drink only minimal fluids. Which of the following suggests a diagnosis of hyperemesis gravidarum?",["Bilious vomiting","Hypokalemia","Metabolic alkalosis","Ketonuria","White race"],3],[981,12,"A 23-year-old woman without prenatal care (gravida 1, para 0) in the third trimester of pregnancy arrives in the emergency department. She has presented because of headache and visual change. While being examined, she had a convulsion. What is the most i  options in reproductive medicine.","provide all requested information in a non-directive way, that will allow the couple to make informed decisions and act in accordance with their decisions.","provide information on occurrence, assisted reproductive technology, and genetic diagnosis.","Provide limited information that is consistent with his/her own personal moral commitments"],2],[990,12,"A 27-year-old woman, gravida 3, para 2, delivers twins via an uncomplicated vaginal delivery. Both placentas are delivered shortly afterward. The patient received regular prenatal care and experienced no issues during her pregnancy. Over the next hour, she continues to experience vaginal bleeding, with an estimated blood loss of 1150 ml. Vital signs are within normal limits. Physical exam shows an enlarged, soft uterus. Which of the following is the most appropriate next step in management?",["Methylergometrine","Hysterectomy","Uterine artery embolization","Misoprostol","Bimanual uterine massage"],4],[991,12,"An 18-year-old G2,p 1+0, presents for her first OB visit at 10 weeks, she reports that the first day of her menstrual period was May 7. her menstrual history was unremarkable. Which of the following is the patient s estimated date of delivery?",["February 10 next Year","February 14 next year","December to same year","December 14 Same year","February 2 next year"],1],[992,12,"Which of the following IS NOT a predisposing factor for premature labor?",["Maternal age older than 35 years","Smoking more than 10 cigarettes per day","Exposure to diethylstilbestrol (DES) in utero with a documented uterine structural abnormality","More than four previous deliveries","Twin gestation"],0],[993,12,"A 33-year-old Para 3 comes to the physician for an annual examination. She has no complaints. Obstetric history is significant for 3 normal vaginal deliveries with gestational diabetes during the last 2 pregnancies. She doesn’t take any medications. Family history is significant for paternal coronary artery disease. Physical examination is unremarkable. Which one of the following investigations should this patient perform?",["Chest X-ray every 3 years.","Coronary angiography every 3 years","Fasting glucose testing every 6 months.","Mammography every 3 years","Pelvic ultrasound every 3 years"],2],[994,12,"A 37-year-old, Para 1+2, came for antenatal care at 10 weeks gestation. Her first 4.5 kg baby was delivered vaginally after 2 abortions. She has no history of gestational diabetes but a positive family history. Her body mass index is 27 kg/m2. What puts her more under a risk to develop gestational diabetes?",["Her previous macrosomic baby.","Her previous two abortions.","Her body mass index.","Her family history for diabetes","Her age in the current pregnancy"],0],[995,12,"A 22-year-old woman who underwent cesarean delivery two days ago, has persistent fever of 38.9°C, despite antibiotic therapy. The urinalysis, wound, breasts, and uterine fundus are normal on examination. A CT Scan of the pelvis is suggestive of septic pelvic thrombophlebitis. Which one of the following is the best therapy for this condition?",["Continue antibiotic therapy & begin IV heparin.","Streptokinase therapy.","Surgical embolectomy.","Discontinue antibiotic therapy and initiate IV heparin.","Continued triple antibiotic therapy"],0],[996,12,"A 32-year-old Para 2+1 had her 20 weeks anomaly scan. A placenta previa extending over the internal cervical os has been identified. What is the appropriate management?",["Trans-vaginal cervical cerclage.","To be re-evaluated at time of term delivery.","Another trans-abdominal scan at 32 weeks.","Placental site identification every two weeks.","Re-assessment at 38 weeks."],2],[997,12,"A 42-year-old, Para 4 pregnant at 38+4 weeks consulted her doctor about recurrent, painless mild attacks of vaginal bleeding during last week. She is clinically free but ultrasound scan showed a posterior placenta previa marginalis. What is the appropriate management?",["Counsel for cesarean hysterectomy.","Immediate watchful induction of labor.","Start of tocolytic drugs.","Wait for spontaneous onset of labor.","Cesarean section is warranted."],1],[998,12,"A 32-year-old Para 2, both deliveries were by CS. Her routine ANC is unremarkable, ultrasound done at 32 weeks shows that the placenta is grade 2 and located anteriorly down to the level of internal os. Which one of the following conditions is the most likely risk?",["Placenta accreta.","Pulmonary edema.","Abruption placenta.","Amniotic fluid embolus","Cerebrovascular accident."],0],[999,12,"A 35 year-old, non-lactating Para3, started to use combined oral contraceptive pills (COCs) after delivery as before. Her last pregnancy was complicated by lower limb deep venous thrombosis (DVT). Which of the following is the proper advice for contraception?",["Continue on COCs with follow-up.","Shift to low dose estrogen COCs.","Use barrier methods for contraception.","Insert an intra-uterine contraceptive device.","Laparoscopic bilateral tubal ligation."],3],[1000,12,"A 38 years old women G5.P3+1 was delivered previously by vaginal delivery with unremarkable obstetric history .she presented at 32 weeks with labor pains and her the cervix is 2cm dilated, the fetus is transvers lie The membranes were ruptured and the amniotic fluid completely derived. What is the best method of delivery for this woman?",["external version","internal version and extraction","oxytocin induction","caesarean delivery","abdominal support to effect position change"],3],[1001,12,"A 25 year old female patient, sustained a laceration of the perineum during delivery, it involved the muscles of perineal body but not the anal sphincter. Which of the following is the degree of this laceration?",["First degree","Second degree","Third degree","Forth degree","Fifth degree"],1],[1002,12,"During routine follow-up of a 35 year-old lady on oral contraceptives for 8 years, a Pap smear was done. The result showed presence of cells suggestive of high grade squamous intra-epithelial lesion (HSIL). Which of the following is the proper further management?",["Repeat cytology after 3-6 months.","Colposcope directed biopsy.","Fractional curettage.","Cervical conization.","Hysterectomy"],3],[1003,12,"A 24 year-old pregnant woman at 8 weeks gestation presents to the ED with a chief complaint of nausea and vomiting. Her abdomen and pelvic examinations are normal and her ultrasonogram reveals a normal live intrauterine pregnancy at 8 weeks. Her urine reveals no ketones. Which of the following is the best recommendation for reducing her symptoms?",["Diazepam","Promethazine","Vitamin B6","Ondansetron","Dexamethasone"],2],[1004,12,"A 30 year-old Para 1, complains of secondary infertility for 4 years duration. Her Hysterosalpingography report revealed bilateral tubal fimbria block and hydrosalpinx were evident. Semen analysis of her husband was unremarkable. Which of the following is the essential step before attempting in-vitro fertilization?",["Laparoscopic fimbriostomy.","Antibiotic courses.","Endometrial biopsy.","Laparoscopic tubal disconnection.","Antibiotic hydrotubation."],3],[1005,12,"A 37 year-old Para 4 has just delivered vaginally. After delivery of the placenta, brisk vaginal bleeding is noticed. The uterus is soft and fails to maintain adequate contraction. Her pulse rises to 125 beats per minute and blood pressure drops to 80/40 mmHg. Which of the following the FIRST step of management?",["IV fluids and prepare for possible blood transfusion.","Uterotonic drugs.","Exploration of genital tract.","Bimanual uterine compression.","Hysterectomy"],2],[1006,12,"A 35-year-old non-lactating Para 2 has inserted an intra-uterine contraceptive device 6 weeks after her last delivery. Two weeks later, she started to notice offensive vaginal discharge, lower abdominal pain and a temperature of 38°c . Her urine culture revealed insignificant bacterial growth. C-reactive protein was elevated and pr ry purpose of the consent process?",["to disclose all information relevant to the surgery","to establish a satisfactory physician patient relationship","to uncover practitioners' biases","to protect patient autonomy","to convince her about surgery"],0],[1014,12,"Over the years the estrogen component of the combined oral contraceptive pills (COCs) has been dramatically decreased. This has in turn minimized certain side effects. Reducing the estrogen content of COCs has resulted in an increase in the rate of which of the following?",["pregnancy","breakthrough bleeding (BTB)","thromboembolic complications","insulin resistance","premenstrual symptoms"],1],[1015,12,"A newly married woman mentions to you, that she had a positive pregnancy test and wonders if you can calculate her expected date of delivery (EDD). The first day of her last menstrual period (LMP) was June 30. Which of the following will be her expected date of delivery?",["44986","39173","46813","45017","39142"],1],[1016,12,"A 35-year-old Para 3 has painless vaginal bleeding at 37 weeks’ gestation. Which of the following measures is immediately indicated?",["Coagulation profile.","Induction of labor.","Cesarean section.","Fetal monitoring.","Rupture of membranes"],2],[1017,12,"A woman in labor develops bleeding at 5-cm dilation with fetal distress. You perform a cesarean section and find a Couvelaire uterus. Which of the following causes a Couvelaire uterus?",["enlargement and invasion by placental tissue into the uterus","uterine retroflexion, and adherence to the cul-de-sac peritoneum of the uterine serosa","intrauterine infection","intramyometrial bleeding","a congenital anomalous development of the uterus"],3],[1018,12,"65-year-old woman is noted to have suspected uterine fibroid on physical examination. Over the course of 1 year, she is noted to have enlargement of uterus approximately from 12 weeks to size 20 weeks. Which of the following is the best management?",["Continued careful examination","Monit
