 <div class="rz" title="Drag to resize · double-click to reset"></div>
 <div class="card side"><p class="mut">${tut?"Green = correct · Red = wrong":'Green = answered · Red = not yet · <span class="dot"></span> marked'}</p><div class="nav">${T.ids.map((x,j)=>{const v=T.ans[x];const s=tut?(v===undefined?"":v==Q.get(x).a?"ok":"bad"):(v===undefined?"bad":"ok");return`<button class="nv ${s} ${j==T.i?"cur":""} ${!tut&&T.mk&&T.mk[x]?"mk":""}" data-a="go" data-j="${j}">${j+1}</button>`}).join("")}</div></div></div>`,k);
 clearInterval(tick);tick=setInterval(tk,1000);tk()}
function tk(){const e=$("#tm");if(!T||T.done||!e)return;if(T.mode=="exam"){const r=(T.endAt-Date.now())/1e3;e.textContent="⏱ "+fmt(r);e.classList.toggle("low",r<300);if(r<=0)finish()}else e.textContent="⏱ "+fmt((Date.now()-T.start)/1e3)}
function finish(){
 if(T.done)return;if(!T.sid)T.sid=T.start;T.done=true;T.fin=Date.now();T.score=T.ids.filter(i=>T.ans[i]===Q.get(i).a).length;T.ids.forEach(i=>{const a=T.ans[i];if(a!==undefined)recW(i,a==Q.get(i).a);else if(T.mode=="exam")recW(i,false)});saveT();
 hist.unshift({t:T.fin,m:T.mode,n:T.ids.length,c:T.score,s:T.sid});hist=hist.slice(0,30);ls.set("qb_hist",hist);DN=DN.filter(x=>x.sid!=T.sid);DN.unshift(T);DN=DN.slice(0,40);ls.set("qb_done",DN);results()}
function results(k){
 clearInterval(tick);const n=T.ids.length,un=T.ids.filter(i=>T.ans[i]===undefined).length,by={};
 T.ids.forEach(i=>{const q=Q.get(i),b=by[q.c]=by[q.c]||[0,0];b[1]++;if(T.ans[i]===q.a)b[0]++});
 const list=T.ids.filter(i=>rev=="all"||(rev=="mk"?!!(T.mk&&T.mk[i]):rev=="wrong"?T.ans[i]!==Q.get(i).a:T.ans[i]===undefined));
 R(`<div class="card"><p class="big">${T.score}/${n} · ${Math.round(T.score/n*100)}%</p><p class="mut">${T.mode=="exam"?"Exam":"Tutor"} ${T.mode=="exam"?"· time "+fmt((T.fin-T.start)/1e3)+" ":""}· unanswered: ${un}</p>
 <table><tr><th>Chapter</th><th>Score</th></tr>${Object.keys(by).map(c=>`<tr><td>${esc(D.ch[c])}</td><td>${by[c][0]}/${by[c][1]}</td></tr>`).join("")}</table>
 <p class="row"><button class="p" data-a="home">Back to home</button><button data-a="rev" data-v="all">All</button><button data-a="rev" data-v="wrong">Wrong + unanswered</button><button data-a="rev" data-v="un">Unanswered</button>${T.mk&&Object.keys(T.mk).length?'<button data-a="rev" data-v="mk">🚩 Marked</button>':""}</p></div>
 ${list.map(i=>{const q=Q.get(i),a=T.ans[i],no=T.ids.indexOf(i)+1;return`<div class="card"><p class="mut">#${no} · ${esc(D.ch[q.c])}${T.mk&&T.mk[i]?" · 🚩 marked":""}</p><p class="q">${hlHTML(i)}</p>${q.o.map((o,k)=>`<div class="opt ${k==q.a?"ok":k==a?"bad":""}"><b>${L[k]}.</b> ${esc(o)}</div>`).join("")}<p class="tag ${a==q.a?"ok":"bad"}">${a===undefined?"Not answered":a==q.a?"✔ Correct":"✘ You chose "+L[a].toUpperCase()}</p><button class="sm" data-a="cp" data-n="${i}">⧉ Copy</button></div>`}).join("")||'<div class="card mut">Nothing to show here.</div>'}`,k)}
function copyQ(n,b){const q=Q.get(n),t=q.s+"\n"+q.o.map((o,k)=>L[k].toUpperCase()+". "+o).join("\n");
 const ok=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent="⧉ Copy",1500)};
 const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()};
 navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb()}
function hlHTML(id){const q=Q.get(id),v=(T&&T.hl&&T.hl[id])||[];let o="",p=0;v.forEach(([a,b],i)=>{o+=esc(q.s.slice(p,a))+`<mark class="hl" data-i="${i}">${esc(q.s.slice(a,b))}</mark>`;p=b});return o+esc(q.s.slice(p))}
function addHl(id,a,b){const s=Q.get(id).s;while(a<b&&/\s/.test(s[a]))a++;while(b>a&&/\s/.test(s[b-1]))b--;if(b<=a)return;T.hl=T.hl||{};
 const v=(T.hl[id]||[]).concat([[a,b]]).sort((x,y)=>x[0]-y[0]),m=[];v.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push([x[0],x[1]])});
 T.hl[id]=m;saveT();const e=$("#stem");if(e)e.innerHTML=hlHTML(id)}
function delHl(id,i){if(T.hl&&T.hl[id]){T.hl[id].splice(i,1);saveT();const e=$("#stem");if(e)e.innerHTML=hlHTML(id)}}
function conf(b,fn){if(b.dataset.c){fn();return}b.dataset.c=1;const o=b.textContent;b.textContent="Tap again to confirm";setTimeout(()=>{delete b.dataset.c;b.textContent=o},3000)}
const A={
 theme(){const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;ls.set("qb_theme",t);T&&!T.done?test(1):T?results(1):home(1)},
 all(){sel=new Set(D.ch.map((_,i)=>i));home(1)},none(){sel=new Set();home(1)},
 chap(b){const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);home(1)},
 start,opt(b){const id=T.ids[T.i];if(T.mode=="tutor"&&T.ans[id]!==undefined)return;T.ans[id]=+b.dataset.k;if(T.mode=="tutor")recW(id,T.ans[id]==Q.get(id).a);saveT();test(1)},
 go(b){const j=+b.dataset.j;if(j>=0&&j<T.ids.length){T.i=j;saveT();test()}},
 fin(b){conf(b,finish)},
 sus(){S=Object.assign({},T,{pa:Date.now()});T=null;ls.set("qb_sus",S);saveT();clearInterval(tick);home()},
 resume(){T=S;T.start+=Date.now()-(S.pa||Date.now());delete T.pa;S=null;ls.set("qb_sus",null);saveT();test()},
 dsus(b){conf(b,()=>{S=null;ls.set("qb_sus",null);home(1)})},
 mark(){if(T.mode=="tutor")return;const id=T.ids[T.i];T.mk=T.mk||{};if(T.mk[id])delete T.mk[id];else T.mk[id]=1;saveT();test(1)},home(){T=null;saveT();home()},
 rv(b){const x=DN.find(y=>String(y.sid)==b.dataset.s);if(x){T=JSON.parse(JSON.stringify(x));rev="all";saveT();results()}},
 rq(){rc=true;home(1)},rno(){rc=false;home(1)},
 rok(){used=new Set();W={};hist=[];DN=[];S=null;T=null;rc=false;saveU();ls.set("qb_w",W);ls.set("qb_hist",hist);ls.set("qb_done",DN);ls.set("qb_sus",null);ls.set("qb_cur",null);home()},
 fm(){setFs(fs-1)},fp(){setFs(fs+1)},fr(){setFs(16)},
 cp(b){copyQ(+b.dataset.n,b)},rev(b){rev=b.dataset.v;results()}};
document.addEventListener("mouseup",e=>{const st=document.getElementById("stem");if(!st||!T||T.done)return;const id=T.ids[T.i],sel=window.getSelection();
 if(sel&&sel.rangeCount&&!sel.isCollapsed){const r=sel.getRangeAt(0);if(!r.intersectsNode(st))return;const f=document.createRange();f.selectNodeContents(st);
  if(r.compareBoundaryPoints(Range.START_TO_START,f)<0)r.setStart(f.startContainer,f.startOffset);if(r.compareBoundaryPoints(Range.END_TO_END,f)>0)r.setEnd(f.endContainer,f.endOffset);
  const p=document.createRange();p.selectNodeContents(st);p.setEnd(r.startContainer,r.startOffset);const a=p.toString().length;addHl(id,a,a+r.toString().length);sel.removeAllRanges()}
 else{const m=e.target.closest&&e.target.closest("mark.hl");if(m&&st.contains(m))delHl(id,+m.dataset.i)}});
document.addEventListener("pointerdown",e=>{const r=e.target.closest&&e.target.closest(".rz");if(r){rzr=r.parentElement.getBoundingClientRect();e.preventDefault()}});
document.addEventListener("pointermove",e=>{if(rzr)setSw(rzr.right-e.clientX-6)});
document.addEventListener("pointerup",()=>{rzr=null});
document.addEventListener("dblclick",e=>{if(e.target.closest&&e.target.closest(".rz")){setSw(dsw(),1);ls.set("qb_sw2",0)}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener("input",e=>{if(e.target.id=="cnt"){cnt=Math.max(1,Math.min(100,+e.target.value||1));const p=pool().length,n=Math.min(cnt,p);$("#info").textContent=p?`${p} ${src=="wrong"?"incorrect":"unused"} questions in selection · this test: ${n} questions${mode=="exam"?" · "+fmt(n*72)+" countdown":""}`:"No questions available in this selection."}});
document.addEventListener("change",e=>{if(e.target.name=="m"){mode=e.target.value;home(1)}if(e.target.name=="s"){src=e.target.value;home(1)}});
T?(T.done?results():test()):home();
</script></body></html>
